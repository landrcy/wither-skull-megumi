[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/landrcy/wither-skull-megumi"
iconFile="logo.png"
authors="landrcy"
description='''
The Impossible Pack (Minecraft 26.3):
- 5% of Wither Skeletons wear Megumi's Jujutsu coat and trigger the 16-second Mahoraga Wither summoning ritual with custom summon & Divine Wheel adaptation sounds, pitch-black void illusion, launching skeleton parts, and an adapting Mahoraga-Wheeled Wither locked exclusively onto you.
- Creepers get struck by lightning 0.5s after starting their fuse and turn into Charged Creepers.
- Skeleton arrows curve mid-flight toward players so they almost always hit.
- Zombies and Skeletons always spawn with at least 1 piece of armor, weighted toward fuller sets with rarer high-tier armor (Leather through Netherite), with 0% equipment drops.
- Endermen clap with Boogie Woogie cursed-energy shockwaves & swap streams to instantly swap positions with you.
- Spiders and Cave Spiders spring their rear abdomen upward and shoot silky gossamer webs that float like real silk and trap you in temporary cobwebs.
- Zombies look down to bridge up and bridge over gaps toward you, break through blocking walls/ceilings, and throw Baby Zombies onto high ledges.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[26.3.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
